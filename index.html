<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="mainContainer">
        <div class="display">Hello</div>
        <div class="buttons">
            <div class="7 button"></div>
            <div class="8 button"></div>
            <div class="9 button"></div>
            <div class="divide button"></div>
            <div class="clear button"></div>
            <div class="4 button"></div>
            <div class="5 button"></div>
            <div class="6 button"></div>
            <div class="plus button"></div>
            <div class="negative button"></div>
            <div class="1 button"></div>
            <div class="2 button"></div>
            <div class="3 button"></div>
            <div class="subtract button"></div>
            <div class="equals button"></div>
            <div class="0 button"></div>

        </div>
    </div>

    <script src="calculatorJs.js"></script>

</html>
